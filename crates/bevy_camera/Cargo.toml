[package]
name = "bevy_camera"
version = "0.17.3"
edition = "2024"
description = "Provides a camera abstraction for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_app = { version = "0.17.3" }
bevy_asset = { version = "0.17.3" }
bevy_image = { version = "0.17.3" }
bevy_mesh = { version = "0.17.3" }
bevy_math = { version = "0.17.3" }
bevy_reflect = { version = "0.17.3" }
bevy_ecs = { version = "0.17.3" }
bevy_transform = { version = "0.17.3" }
bevy_derive = { version = "0.17.3" }
bevy_utils = { version = "0.17.3" }
bevy_color = { version = "0.17.3", features = [
  "serialize",
] }
bevy_window = { version = "0.17.3" }

# other
wgpu-types = { version = "26", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
downcast-rs = { version = "2", default-features = false, features = ["std"] }
derive_more = { version = "2", default-features = false, features = ["from"] }
smallvec = { version = "1", default-features = false, features = ["const_new"] }

[features]
default = []

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
